<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Eagle Eye</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet" href="login .css">
</head>
<body>

<div class="auth-page d-flex align-items-center justify-content-center">
  <div class="auth-card">

    <div class="text-center mb-4">
      <h2 class="brand">EAGLE EYE</h2>
      <p class="subtitle">Secure Login</p>
    </div>

    <form>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="Enter email">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="Enter password">
      </div>

      <div class="d-flex justify-content-between mb-3">
        <label><input type="checkbox"> Remember me</label>
        <a href="#" class="link">Forgot?</a>
      </div>

      <button class="btn auth-btn w-100">Login</button>

      <p class="text-center mt-3">
        Don’t have an account?
        <a href="register.html" class="link">Register</a>
      </p>

      <p class="text-center">
        <a href="index.html" class="link">← Back to Home</a>
      </p>
    </form>

  </div>
</div>

</body>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
