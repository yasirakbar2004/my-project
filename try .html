<!DOCTYPE html>
<html>
<head>
  <title>Header Hide After Scroll</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    body {
      margin: 0;
      height: 2000px;
      font-family: Arial;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: #0f2027;
      color: white;
      padding: 20px;
      text-align: center;
      transition: top 0.5s ease;
      z-index: 999;
    }

    .hide-header {
      top: -100px;
    }
  </style>
</head>

<body>

<header id="header">
  My Header
</header>

<script src="https://code.jquery.com/jquery-4.0.0.min.js">
  $(document).ready(function () {
  let hideTimer;
  let showTimer;

  $(window).on("scroll", function () {

    // show header immediately while scrolling
    $("#header").removeClass("hide-header");

    // clear previous timers
    clearTimeout(hideTimer);
    clearTimeout(showTimer);

    // hide header AFTER 1.5 seconds of scrolling
    hideTimer = setTimeout(function () {
      $("#header").addClass("hide-header");
    }, 1500);

    // show header again AFTER scrolling stops (idle)
    showTimer = setTimeout(function () {
      $("#header").removeClass("hide-header");
    }, 2500);

  });
});

</script>
</body>
</html>
